const statusOf = (c) => { c = String(c); for (const [s,n] of [["🚫","blocked"],["🔄","progress"],["⬜","todo"],["❓","unknown"]]) if (c.includes(s)) return n; return c.includes("✅") ? "done" : "none"; };

const tzShort = {"America/New_York":"ET","America/Los_Angeles":"PT","Europe/Sofia":"Sofia"};
const fmt = (iso, tz) => new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso)) + " " + (tzShort[tz]||tz);

const LABEL = {done:"done",progress:"in progress",todo:"not started",blocked:"blocked",unknown:"unverified"};
const statusChip = (st, v) => chip(st, String(v).replace(/^(✅|🔄|⬜|🚫|❓)\s*/, "") || LABEL[st]);
const trackerTable = (prefix) => { const k = Object.keys(D.tracker).find(k => k.startsWith(prefix)); return k ? D.tracker[k] : []; };

function table(headers, rows, opts = {}) {
  return `<table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function trackerHtml(rows) {
  if (!rows.length) return "";

  const cell = (v) => { const st = statusOf(v); return st === "none" ? esc(v) : statusChip(st, v); };
  return table(hs, rows.map(r => hs.map((h,i) => i === 0 ? `<b>${esc(r[h])}</b>` : cell(r[h]))));
}
